services:
  postgres:
    image: postgres:16-alpine
    container_name: duty-scheduler-postgres
    environment:
      - POSTGRES_USER=duty
      - POSTGRES_PASSWORD=duty
      - POSTGRES_DB=duty
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

