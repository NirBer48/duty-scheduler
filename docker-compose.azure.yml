version: '3.8'

services:
  server:
    image: nirberkovich/duty-scheduler-server:latest
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - PGSSLMODE=require
    ports:
      - '4000:4000'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    image: nirberkovich/duty-scheduler-client:latest
    ports:
      - '80:80'
    restart: unless-stopped
